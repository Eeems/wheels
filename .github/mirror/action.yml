name: Mirror wheels
description: Mirrors built wheels to the wheels.eeems.codes server via SSH.
author: Eeems

inputs:
  ssh_host:
    description: SSH server hostname
    required: true
  ssh_key:
    description: SSH private key secret
    required: true
  ssh_dir:
    description: Remote directory path
    required: true
  ssh_user:
    description: SSH username
    required: true
  ssh_args:
    description: Additional SSH arguments
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Fail — ./mirror/ action not available in this fork
      shell: bash
      run: |
        echo "error: this wheels fork does not have a ./mirror/ composite action."
        echo "  Wheel mirroring to wheels.eeems.codes is an upstream-only concern."
        echo "  The upstream Eeems/wheels repo has never included this action directory."
        exit 1
